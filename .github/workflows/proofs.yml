name: Synthetic proof contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/bootstrap.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 proofctl.py prove --jobs 1 --timeout 60
      - run: python3 proofctl.py audit --jobs 1 --timeout 60
